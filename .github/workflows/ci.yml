name: CI

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: |
          python -m compileall -q .

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests

      - name: Linux release check
        run: |
          python scripts/check_linux_release.py

      - name: Offline smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/trofeo_smoke_test.py --render-limit 6
